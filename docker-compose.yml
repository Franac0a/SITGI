services:
  db:
    image: mysql:8.0
    container_name: sitgi-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: citproyecto
      MYSQL_USER: sitgi
      MYSQL_PASSWORD: sitgi_dev
      MYSQL_ROOT_PASSWORD: root_dev
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "${DB_PUERTO:-3306}:3306"
    volumes:
      - sitgi-datos:/var/lib/mysql
      - ./docker/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_dev"]
      interval: 5s
      timeout: 5s
      retries: 20

  # backend y frontend solo arrancan con: docker compose --profile app up -d --build
  backend:
    build: ./backend
    container_name: sitgi-backend
    profiles: ["app"]
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      FRONTEND_URLS: http://localhost:8080
    ports:
      - "4000:4000"
    volumes:
      - sitgi-uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4000/api
    container_name: sitgi-frontend
    profiles: ["app"]
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  sitgi-datos:
  sitgi-uploads:
